<!DOCTYPE html>
<html lang="tr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Güvenli Şehir Bilgi Sistemi</title>



  <style>
    /* Tam ekran iframe */
    .full-embed {
      width: 100%;
      height: 100vh;
      border: none;
      margin: 0;
      padding: 0;
      display: block;
    }

    /* Header & footer gizleme */
    header, footer {
      display: none !important;
    }

    body {
      margin: 0;
      background: #000;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <!-- Embed Alanı -->
  <iframe 
      class="full-embed"
      src="https://experience.arcgis.com/experience/0ec8ae23801f43aaaa3b2580c5531360/"
      allowfullscreen>
  </iframe>

</body>
